name: Deploy news radar to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - work
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Generate static news data
        run: node scripts/generate-static-data.js
        env:
          NEWS_TOPICS: ${{ vars.NEWS_TOPICS || 'AI,半導體,氣候科技' }}
          NEWS_FEEDS: ${{ vars.NEWS_FEEDS || '' }}
          NEWS_MAX_ITEMS_PER_TOPIC: ${{ vars.NEWS_MAX_ITEMS_PER_TOPIC || '25' }}
          NEWS_CRON: '0 7 * * *'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
